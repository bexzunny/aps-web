<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>PRACTICA COMPLETA DE JAVASCRIPT Y CSS</h1>
            </header>
            <div class="div_main">

                <p>Esta es una práctica completa de javascript y css,
                    donde se aplicacn los conocimientos adquiridos
                    en el curso de desarrollo web. A continuación, se 
                    presentan diferentes secciones que demuestran 
                    el uso de estilos CSS y funcionalidades de JavaScript.
                </p>
                <button class="btn" id="btn_modo">Cambiar estilo</button>
            </div>
            <div class="div_flex">
                <div class="div_flexhijo amarillo">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
                <div class="div_flexhijo verde">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
                <div class="div_flexhijo azul">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
                <div class="formulario">
                    <form>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="INgrese su nombre">
                        <br>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required placeholder="Ingrese su correo">
                        <br>
                        <label for="pass">Contraseña:</label>
                        <input type="password" id="pass" name="pass" required placeholder="INgrese su Contraseña">
                        <label for="cel">Numero de teléfono:</label>
                        <input type="tel" id="cel" name="cel" required placeholder="Ingrese su numero de telefono">
                        <br>
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Ingrese su mensaje"></textarea>
                        <br>
                        <input type="submit" value="enviar">
                    </form>

                </div>
                <div class="div_flexhijo morado">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
                <div class="div_flexhijo naranja">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
                <div class="div_flexhijo rojo">
                    <img src="htpps://img" alt="Imagen 1">
                    <br>
                </div>
            </div>
        <script src="function.js"></script>
    </body>
</html>
